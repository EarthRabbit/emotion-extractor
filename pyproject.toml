[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emotion-extractor"
version = "0.1.0"
description = "Hybrid CNN-FaceNet model for emotion classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0.0",
    "tensorboard>=2.20.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm>=4.67.1",
    "facenet-pytorch>=2.5.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/data", "src/models", "src/training", "src/util"]

[tool.hatch.build.targets.sdist]
include = ["src"]

# This makes 'src' directory available as a package root
# so you can import like: from util.cuda import ...
[tool.hatch.build.targets.wheel.sources]
"src" = ""
